# vox vocabulary — edit freely, then run:  vox restart
#
# Literal word/phrase replacements applied AFTER transcription.
# Matching is case-insensitive and whole-word only, so "yah" never touches
# "yahan". If the original started with a capital, the replacement is
# capitalised too. Longer phrases win over shorter ones.
# Keys containing a space must be quoted.
#
# Why there is no keyword-bias list here: Whisper's initial-prompt biasing was
# measured on 2026-08-11 and it made things worse — a 508-character list of our
# project names slowed decoding by 30% AND corrupted a word it used to get
# right ("Helmet" became "Helpet"). Deterministic replacements below cost
# nothing and only ever touch what they are aimed at.

[fix]
# --- Hinglish spelling: the model writes book-transliteration, we want casual ---
yah        = "ye"
vah        = "wo"
veh        = "wo"
thik       = "theek"
mainne     = "maine"
nahin      = "nahi"
achchha    = "achha"
sachchi    = "sacchi"
svaad      = "swaad"
"maine ne" = "maine"
"kyun ki"  = "kyunki"
"is liye"  = "isliye"
"ke lie"   = "ke liye"
"hain na"  = "hai na"

