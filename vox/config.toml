# vox — system-wide voice typing.  Edit, then run:  vox restart
# Switch model quickly:  vox model hinglish   |   vox model english

# ── the gesture ───────────────────────────────────────────────────────────────
# Two gestures, two models. Double-tap the bare modifier.
modifier             = "Alt"    # Hinglish  — Hindi + English, romanised
modifier_english     = "Ctrl"   # English   — Parakeet, perfect punctuation, no Hindi
                                # set to "" to disable the second gesture
double_tap_window_ms = 300      # gap between first release and second press

# ── model lifetime ────────────────────────────────────────────────────────────
idle_unload_sec = 300           # drop the model from RAM after 5 min idle (0 = never)
threads         = 4             # inference threads

# ── recording ─────────────────────────────────────────────────────────────────
# The DENOISED virtual mic, not the raw one. The HP Envy 13's internal mic sits
# next to the fan, and on 2026-08-13 dictation stopped working entirely after an
# hour of whisper benchmarking had the fan running: the room floor measured
# rms 0.0293 / peak 0.1225 while his voice at arm's length only reached peak
# 0.08-0.23, so speech never stood out and every session ended
# "abort: no speech". Through rnnoise_source the same room measures rms 0.0000
# / peak 0.0008 — a ~150x quieter floor, so normal speech towers over it.
#
# The source comes from dots/pipewire/99-input-denoising.conf, which had been
# sitting symlinked as `.disabled` since hyprvoice was retired. Set to "" to go
# back to the raw hardware mic.
source         = "rnnoise_source"
max_record_sec = 300            # hard stop so a forgotten session cannot run forever
min_record_sec = 0.35           # shorter than this is treated as a misfire

# ── on-screen overlay ─────────────────────────────────────────────────────────
overlay            = true       # bottom-centre waveform while recording
# The live caption is GONE (2026-08-13). There used to be a second strip across
# the top of the screen streaming provisional text while you spoke, and these
# keys tuned it: live_preview, partial_every_sec, buffer_trim_sec, keep_live_sec,
# preview_max_window_sec, partial_threads. All removed, along with the second
# whisper-server the caption needed (~70 MB) and a decode every ~1.2 s taken
# from the machine while the mic was open.
#
# Yash: "koi processing nahi ho jab tak mike se recording ho rahi ho."
# So: waveform while you talk, one decode when you stop, text lands at once.

# ── output ────────────────────────────────────────────────────────────────────
# paste     : put it on the clipboard and fire the paste shortcut — the whole
#             text lands at once, instantly, however long it is.
#             Ctrl+Shift+V when a terminal has focus, Ctrl+V everywhere else,
#             injected by Hyprland's own sendshortcut. Falls back to typing.
# type      : simulate keystrokes. Reliable everywhere, but ~5 ms per character.
# clipboard : copy only, paste it yourself.
output            = "paste"
copy_to_clipboard = true        # always also copy the final text
trailing_space    = true        # add a space after, so you can keep dictating
# Apps whose paste shortcut is Ctrl+Shift+V instead of Ctrl+V.
terminal_classes  = ["kitty", "foot", "alacritty", "wezterm", "ghostty", "xterm",
                     "konsole", "gnome-terminal", "orca-ide", "stably-orca"]
type_delay_ms     = 0           # ms between keystrokes; raise to 2-4 if an app still drops keys
# Long text typed in one burst overruns terminals and TUIs — they split it across
# submissions and eat the first characters. So it goes out in bites.
type_chunk_chars    = 300       # max characters per burst (0 = one burst)
type_chunk_pause_ms = 120       # pause between bursts
notify            = true

# ── engine ────────────────────────────────────────────────────────────────────
# whisper  : Whisper-Hindi2Hinglish-Swift q5_0 via whisper-server. A whisper-base
#            fine-tune that writes Hindi in Roman script. THIS IS THE HINGLISH ONE.
#            Measured here: RTF ~0.20 (10 s of speech -> ~2 s). Weaker punctuation.
# parakeet : sherpa-onnx Parakeet TDT 0.6B v3 int8 — the model Orca uses.
#            Measured here: RTF 0.10, perfect English with punctuation, but it has
#            no Hindi at all ("kisi ek varg" came out as "kisi ekvariki").
#
# Rejected after measuring on this CPU — kept here so nobody re-tests them:
#   whisper small ......................... RTF 1.38
#   Hindi2Hinglish-Apex (large-v3-turbo) .. RTF 3.48  (encoder alone 29.7 s)
engine = "whisper"

whisper_model = "~/.local/share/vox/models/ggml-hinglish-q5_0.bin"
# "auto" makes Whisper run a separate language-detection pass first — measured
# at 2.2 s of pure waste on an 11 s clip, with identical output. Keep it pinned.
whisper_lang  = "en"
whisper_port  = 8127

# Voice activity detection — whisper only ever sees the parts with speech in
# them. Without it, a mic with a loud idle floor makes it hallucinate: 10 s of
# an empty room decoded as "Haan."
vad_model     = "~/.local/share/vox/models/silero_vad.onnx"
vad_threshold = 0.4             # raise toward 0.6 if noise still gets through

parakeet_dir  = "~/.config/orca/speech-models/parakeet-tdt-0.6b-v3-int8"

# ── second pass: punctuate and paragraph a long dictation ────────────────────
# whisper writes one run-on line. On a two-minute dictation that is a wall of
# text, and the mis-hearings the vocabulary cannot reach are exactly the ones
# only context catches — "mic bilkul mere munh se" came back as "main ek bilkul
# mere munh se", which no literal rule could ever fix.
#
# Runs through the agy rotator ALREADY RUNNING on this box at localhost:51200 —
# zero quota across 8 accounts, no auth, nothing to start. Going through the
# `agy` CLI instead costs 14-16 s of startup alone (measured), which would have
# doubled the wait for nothing.
#
# Only past polish_min_sec, because the round trip is FLAT at ~6-8 s whatever
# the length (measured: 350 chars 6.0 s, 1050 chars 7.8 s). Against 14 days of
# real use — 41 dictations, median 10.6 s, p90 53.5 s — that means a 10 s
# dictation would go 4 s -> 11 s (not worth it) while a 53 s one goes
# 20 s -> 27 s (clearly worth it).
#
# Fails open: any error, timeout, or a reply shorter than half the input (which
# would be a summary, not a cleanup) and the raw transcript is delivered
# unchanged. Set polish = false to turn the whole thing off.
polish             = true
polish_min_sec     = 25.0       # shorter than this stays instant
polish_model       = "gemini-3-flash"
polish_url         = "http://127.0.0.1:51200/v1/chat/completions"
polish_timeout_sec = 25.0
