# hyprvoice — local, offline dictation (no API key required)
# Wired by Envy 2026-07-04. Change providers/models anytime with `hyprvoice configure`.

[transcription]
provider = "whisper-cpp"
model = "small"            # 466MB, multilingual — more accurate, supports Hindi/Hinglish
language = "en"            # was "" (auto-detect) — misfired into looping Sinhala garbage
                            # on real English speech (verified twice). Pin to English;
                            # revisit "hi" if you're dictating pure Hindi sentences.
threads = 0                 # 0 = auto (NumCPU - 1)

# hyprvoice doesn't apply a default here when this section is omitted — omitting it
# leaves SampleRate at the zero value and every recording fails ("invalid SampleRate: 0").
[recording]
sample_rate = 16000
channels = 1
format = "s16"
buffer_size = 8192
device = "rnnoise_source"  # boosted+denoised virtual mic (dots/pipewire/99-input-denoising.conf)
channel_buffer_size = 30
timeout = "5m"

# LLM cleanup (punctuation/grammar/filler removal) needs an OpenAI or Groq API key.
# Off by default so this works with zero signup. Flip to true + add a key under
# [providers.groq] / [providers.openai] (free Groq tier works) to enable it.
[llm]
enabled = false

# Same zero-value gotcha as [recording] above: omitting timeouts leaves them at 0s,
# so every injection attempt hit an instant "context deadline exceeded" (verified live).
[injection]
backends = ["wtype", "clipboard"]   # ydotoold isn't running on this box; wtype is native Wayland
ydotool_timeout = "5s"
wtype_timeout = "5s"
clipboard_timeout = "3s"

# Third instance of the same omitted-section bug (recording, injection, now this):
# empty type defaults to "" which fails validation ("must be desktop, log, or none").
[notifications]
enabled = true
type = "log"                # "desktop" hit this machine's known dunst/xfce4-notifyd
                              # D-Bus race — toasts rendered as overlapping garbled text.
                              # Log-only avoids it; the injected text is the real signal.

keywords = ["Hyprland", "Wayland", "PipeWire", "Railway", "TypeScript", "Claude", "NetrunnersHQ"]
