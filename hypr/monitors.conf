# Set your monitor configuration here
# See https://wiki.hyprland.org/Configuring/Monitors/
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/monitors.t2

monitor = eDP-1, 1920x1080@60, 0x0, 1

# Any EXTERNAL monitor (catch-all — eDP-1 above is explicit so it's unaffected)
# defaults to the LEFT of the laptop, since Yash physically places it on his left.
# `auto-left` positions it just left of the existing arrangement (x negative), so
# the pointer moves LEFT from the laptop to reach it. This is the persistent,
# reload-safe baseline (fixes the old drift where reloads reset it to the right).
monitor = , highrr, auto-left, 1
