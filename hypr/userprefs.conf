# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information


# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hyprland.org/Configuring/Variables/#input

# Walker disabled (elephant binary broken) — using rofi via HyDE
# exec-once = walker --gapplication-service

# Monitor failback watcher: if an external screen disappears, re-home everything
# to the laptop automatically so no workspaces get stranded on a dead output.
exec-once = ~/.config/hypr/monitor-fallback.py

# vox — system-wide voice typing (double-tap Alt = whisper, double-tap Ctrl = parakeet).
# Its unit is WantedBy=graphical-session.target, but nothing on this box ever
# activates that target (verified 2026-08-12: `systemctl --user is-active
# graphical-session.target` = inactive), so vox silently never came back after the
# session restart on 11 Aug 21:18 — it had run fine for the 13 hours before that.
# Starting it here instead guarantees Wayland is already up, which is what vox
# needs. Already-running is a no-op, so this is safe if the target ever works.
#
# GUARDED ON is-enabled, and that guard is the whole point (2026-08-21). A bare
# `systemctl --user start vox` ignores `disable` completely — enablement only
# controls whether a TARGET pulls the unit in, never whether an explicit start
# works. So `nhq-voice-stop` would disable vox, and the next Hyprland launch
# would start it straight back up. Yash hit exactly that after a reboot and
# reasonably read it as "the off switch does nothing".
#
# That also broke `nhq-voice-stop`'s own stated contract — "An off switch that
# quietly turns itself back on is worse than no off switch". The guard keeps the
# reason this line exists (dead graphical-session.target) while letting `disable`
# actually mean off. `nhq-voice-stop --on` re-enables and it comes back.
exec-once = systemctl --user is-enabled vox >/dev/null 2>&1 && systemctl --user start vox

# ── Multi-monitor profiles + workspace helpers ───────────────────────────
# Daily default: laptop primary, external monitor to whichever side you place
# it (dual-right / dual-left). Hard requirement: if the external disappears,
# the watcher collapses back to laptop-only and rehomes workspaces to eDP-1
# automatically. Placed at the top of this file (not just at the top of
# userprefs.conf's own binds) so it registers first among all custom binds
# and shows up at the top of the Super+/ keybind hint menu, which lists
# entries in hyprctl-registration order.
# Single monitor toggle on the laptop's dedicated display key (F4, keysym
# XF86Display): external ENABLED -> collapse to laptop-only; external OFF ->
# bring it up in the correct dual layout (external on the LEFT). Replaces the
# old Super+Ctrl+{M,N,.} profile binds, which were trivially fat-fingered
# (Super+Ctrl+, once silently disabled the external and looked like a dead
# cable). One key, on/off, no combos to fumble.
bindd = , XF86Display, [Display|Monitors] toggle dual-screen / laptop-only, exec, ~/.config/hypr/monitor-profile.sh toggle
# NOTE: bracket keys used here, not arrows — HyDE has already bound nearly
# every Super+{Ctrl,Alt,Shift combo}+Left/Right (workspace switch, window
# resize/nudge, wallpaper cycle, relative workspace move). Two of those
# silently collided with earlier arrow-based binds here (confirmed via
# `hyprctl binds -j`, not config-text grep, which missed a "Control" vs
# "CTRL" spelling difference). Brackets have zero pre-existing binds.
# "left"/"right" mean spatially left/right of the focused monitor (by actual
# x-position) — correct for whichever profile is active (dual-left/dual-right),
# not hardcoded to "external vs laptop".
# Tier: bare Ctrl = move WINDOW (most-used), +Shift = move workspace, +Alt = focus only.
bindd = $mainMod CTRL, bracketright, [Display|Monitors] send active window right, exec, ~/.config/hypr/monitor-profile.sh window-right
bindd = $mainMod CTRL, bracketleft, [Display|Monitors] send active window left, exec, ~/.config/hypr/monitor-profile.sh window-left
bindd = $mainMod CTRL SHIFT, bracketright, [Display|Monitors] send current workspace right, exec, ~/.config/hypr/monitor-profile.sh move-right
bindd = $mainMod CTRL SHIFT, bracketleft, [Display|Monitors] send current workspace left, exec, ~/.config/hypr/monitor-profile.sh move-left
bindd = $mainMod CTRL ALT, bracketright, [Display|Monitors] focus right monitor, exec, ~/.config/hypr/monitor-profile.sh focus-right
bindd = $mainMod CTRL ALT, bracketleft, [Display|Monitors] focus left monitor, exec, ~/.config/hypr/monitor-profile.sh focus-left
# Intuitive send-window-to-a-side: plain Ctrl+Alt (no Super) + arrows, NATIVE dispatcher
# (movewindow mon:l/r) — reliable, unlike the monitor-profile.sh exec path above.
# Left = external monitor (physically left), Right = laptop (physically right).
bindd = CTRL ALT, Left, [Display|Monitors] send window to external monitor (left), movewindow, mon:l
bindd = CTRL ALT, Right, [Display|Monitors] send window to laptop (right), movewindow, mon:r

# Super+/ keybind hint (hyde-shell keybinds_hint). Sized to HUG the single-column
# content: at 95% width the list only filled the left ~1/3, leaving 2/3 empty so
# scrolling felt disconnected. 48% width hugs the entries. The LINE count (not the
# HEIGHT %) actually drives the window height, so 42 lines keeps it tall/full while
# HEIGHT caps it. NOTE: `env =` applies at Hyprland STARTUP; re-login makes it fully live.
env = ROFI_KEYBIND_HINT_WIDTH,48%
env = ROFI_KEYBIND_HINT_HEIGHT,90%
env = ROFI_KEYBIND_HINT_LINE,42


input {
    # kb_layout = us
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat 
    # numlock_by_default = true

    # Touchpad stays on.
    touchpad {
        natural_scroll = yes
    }

    # Broken touchscreen: disable touch input entirely so phantom taps stop.
    touchdevice {
        enabled = false
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}


# Custom Keybindings

# Logout menu
bind = $mainMod, X, exec, $scrPath/logoutlaunch.sh

# Resize window (using bindm for mouse resize)
bindm = $mainMod Alt, R, resizewindow

# Maximize (fullscreen)
bind = $mainMod, M, fullscreen

# Toggle floating
bind = $mainMod, F, togglefloating

# Lock screen
bind = $mainMod SHIFT, L, exec, lockscreen.sh

# Terminal emulator
bind = $mainMod, Return, exec, /home/yash/.config/hypr/kitty-tmux.sh   # tmux terminal (+ chooser if tmux already running)

# Web Browser
unbind = $mainMod, W # Original Toggle floating
bindd = $mainMod, W, [Launcher|Apps] web browser, exec, /home/yash/.config/hypr/firefox-raise.sh

# NHQ dashboard — dedicated lightweight browser (vimb), NOT Firefox.
# SUPER+N was verified free before taking it: `hyprctl binds` showed SUPER+<letter>
# already using B D E F G I J K M P Q R S T V W X Z, and no config file bound N.
#
# vimb rather than a "lightweight" alternative because most of them are not:
# qutebrowser and falkon both pull qt6-webengine, which IS Chromium. Epiphany is
# genuinely lighter but its current build needs GLIBC_2.44 against this system's
# 2.43, so it cannot run until a full -Syu. vimb uses webkit2gtk-4.1, already
# installed and glibc-compatible. Measured: 230 MB / 3 procs vs chromium --app at
# 242 MB / 9 — the win is process count and a chromeless window, not RAM.
#
# --raise so a second press focuses the existing window instead of stacking
# duplicate dashboards.
bindd = $mainMod, N, [Launcher|Apps] NHQ dashboard (vimb), exec, pgrep -x vimb >/dev/null && hyprctl dispatch focuswindow class:vimb || vimb http://192.168.31.70:3900/

# Keybindings hint (SUPER+/) — maximized instead of a 35em box in the middle.
#
# HyDE binds this in ITS keybindings.conf, which regenerates, so the bind is
# re-declared here in my layer rather than edited there. `unbind` first because
# two binds on one chord would both fire.
#
# Going through HyDE's script with its env vars only got as far as "maximized but
# ugly" — everything crammed into the left third, two thirds empty. Its script
# exposes width/height/lines and nothing else, so the layout could not be fixed
# from outside. `nhq-keyhint` keeps HyDE's DATA (hint-hyprland.py parses the live
# binds, which is the hard part) and replaces only the presentation:
# dots/rofi/keyhint.rasi — two columns x 22 lines, blurred wallpaper backdrop, and
# colours imported from HyDE's generated palette so it re-themes with the wallpaper.
unbind = $mainMod, slash
bindd = $mainMod, slash, [Utilities] keybindings hint (fullscreen), exec, nhq-keyhint

# File explorer
bind = Control Alt, F, exec, $EXPLORER

# Text editor
unbind = $mainMod, E # Original File explorer
# bindd = $mainMod, E, [Launcher|Apps] text editor, exec, /usr/bin/subl # This is not working

# Application finder — drun (apps only). Was combi "drun,run", but `run` also listed
# every PATH binary, so each app showed TWICE (e.g. "Obsidian" + "obsidian"). drun =
# clean app list with icons, no dupes. (Raw-command/sudo runner dropped from here — can
# live on a separate key if wanted.) -terminal kept so drun's Terminal=true apps open in kitty.
bindd = $mainMod, D, [Launcher|Apps] application finder, exec, pkill -x rofi || rofi -show drun -show-icons -terminal "kitty --hold" -theme ~/.config/rofi/spotlight.rasi

# Rename current workspace
bind = $mainMod, R, exec, ~/.config/hypr/scripts/rename-workspace.sh

# Move window
bindm = $mainMod Alt, M, movewindow

# Regroup HyDE's move-active-window binds: keybindings.conf sets $d for them but
# forgot to prefix the descriptions, so they fell into "Misc" in the Super+/ menu.
# Re-declare with the proper group ($moveactivewindow is still defined upstream).
unbind = $mainMod Shift Control, left   # drop HyDE's ungrouped (Misc) versions first
unbind = $mainMod Shift Control, right
unbind = $mainMod Shift Control, up
unbind = $mainMod Shift Control, down
bindde = $mainMod Shift Control, left, [Window Management|Move active window] move window left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Shift Control, right, [Window Management|Move active window] move window right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Shift Control, up, [Window Management|Move active window] move window up, exec, $moveactivewindow 0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Shift Control, down, [Window Management|Move active window] move window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Unbind original keybindings to avoid conflicts
unbind = Shift, F11 # Original Toggle fullscreen
unbind = Control Alt, Delete # Original Logout menu
unbind = $mainMod, L # Original Lock screen
unbind = $mainMod, X # Original hold to resize window (mouse binding)
unbind = $mainMod, T # Original Terminal emulator
unbind = $mainMod, B # Original Web Browser
# Re-bind Super+B (freed just above from HyDE's browser default) to a waybar
# show/hide toggle. MUST come AFTER the unbind — unbinds process in file order,
# so a bind placed before this line gets stripped. HyDE runs waybar as one
# systemd process across all outputs, so this toggles every screen at once
# (SIGUSR1 via `waybar --hide`).
bindd = $mainMod, B, [Display|Monitors] toggle waybar (all screens), exec, hyde-shell waybar --hide
unbind = $mainMod, C # Original Text editor
unbind = $mainMod, A # Original Application finder
unbind = $mainMod, E # Original File explorer

# Test binding (now for Sublime)
bindd = $mainMod, I, [Launcher|Apps] text editor, exec, /usr/bin/subl
# Final Overrides
unbind = $mainMod, X
bind = $mainMod, X, exec, $scrPath/logoutlaunch.sh
bind = $mainMod, E, exec, /home/yash/.config/hypr/sublime-raise.sh
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod Alt, mouse:272, resizewindow

# Super+T = plain kitty (no tmux). Placed after the `unbind = $mainMod, T` above so it sticks.
bind = $mainMod, T, exec, kitty

# WhatsApp (ZapZap) launcher
bindd = Control Alt, W, [Launcher|Apps] WhatsApp (ZapZap), exec, flatpak run com.rtosta.zapzap

# AyuGram (Telegram) launcher
bindd = Control Alt, T, [Launcher|Apps] AyuGram (Telegram), exec, AyuGram

# Obsidian — nHQ vault (Win+J trial; Win+D untouched)
bindd = $mainMod, J, [Launcher|Apps] Obsidian nHQ vault, exec, xdg-open obsidian://open?vault=nHQ
bindd = Control Alt, O, [Launcher|Apps] Obsidian nHQ vault, exec, xdg-open obsidian://open?vault=nHQ

# Claude Code live overview — kitty running claude-overview -w (replaced dead opcode AppImage)
bindd = Control Alt, C, [Launcher|Apps] Claude overview, exec, kitty --title claude-overview -e /home/yash/.local/bin/claude-overview -w 2

# Emoji picker = smile (iOS-style scrollable grid, categories, skin tones, recents).
# unbind HyDE's own Super+, (hyde-shell emoji-picker) first so it doesn't collide.
unbind = $mainMod, comma
bindd = $mainMod, comma, [Launcher|Apps] emoji picker, exec, flatpak run it.mijorus.smile

# Voice dictation = hyprvoice (open-source SuperWhisper equivalent for Wayland/Hyprland).
# Toggle: press once to start recording, press again to stop + inject transcribed text.
# NOT SUPER+V — that's HyDE's default clipboard history bind (keybindings.conf:99, cliphist).
bindd = Alt, SPACE, [Launcher|Apps] voice dictation (hyprvoice), exec, hyprvoice toggle

# Free up bare F11 so it reaches apps (Firefox F11 = native fullscreen / "zen" page-only view).
# HyDE had bound bare F11 to volume-down, swallowing the key before any app saw it.
# Volume-down still works via the dedicated media key (XF86AudioLowerVolume) / Fn+F11.
unbind = , F11
# Bare F12 too: this HP Envy's F12 is the airplane key (Fn layer), NOT volume-up.
# HyDE had bound bare F12 to volume-up, which both swallowed F12 (browser DevTools) and
# was wrong for the keyboard. Free it: bare F12 -> apps (DevTools); airplane via Fn+F12.
unbind = , F12
# Bare F10 too: on this HP Envy 13 F10 is play/pause (Fn layer), NOT mute. HyDE's bare-F10
# mute bind hijacked it. Free it: bare F10 -> apps; play/pause via Fn+F10 (XF86AudioPlay).
# Net result: the whole F-row is function-keys-first (F1-F12 reach apps); the printed media
# icons (brightness F2/F3, mute F6, vol F7/F8, prev/play/next F9/F10/F11, airplane F12) all
# fire via Fn, which emits XF86* codes already bound in keybindings.conf.
unbind = , F10

# Print Screen keybindings:
#   Print               = region select → clipboard (no editor)
#   Win+Print           = region select → satty markup editor
#   Shift+Print         = all monitors → clipboard + file
#   Win+Shift+Print     = CURRENT monitor only → clipboard + file (grimblast copysave output)
unbind = , Print
bindd = , Print, [$ut|Screen Capture] snip to clipboard, exec, /home/yash/.local/lib/hyde/grimblast copy area
bind = $mainMod, Print, exec, hyde-shell screenshot s
binddl = Shift, Print, [$ut|Screen Capture] print all monitors, exec, hyde-shell screenshot p
binddl = $mainMod SHIFT, Print, [$ut|Screen Capture] current monitor capture, exec, /home/yash/.local/lib/hyde/grimblast --notify copysave output

# Pin Firefox to workspace 2 (silent = land there without yanking focus on background windows;
# the Super+W run-or-raise script handles "take me there" on launch)
windowrule = workspace 2 silent, match:class ^(firefox)$


# tmux chooser popup (Super+Enter when tmux already running) — small, floating, centered
windowrule = float true, match:class ^(kitty-chooser)$
windowrule = size 720 260, match:class ^(kitty-chooser)$
windowrule = center true, match:class ^(kitty-chooser)$

# satty (screenshot annotation) — always float and center
windowrule = float true, match:class ^(com.gabm.satty)$
windowrule = center true, match:class ^(com.gabm.satty)$

# vimb keybinding popup — `kb` inside vimb spawns a kitty with the cheat sheet in
# `less`, which quits on q with nothing extra to bind. Float + center + a fixed
# size is what makes it read as a popup rather than another tiled window.
windowrule = float true, match:class ^(vimb-keys)$
windowrule = size 760 720, match:class ^(vimb-keys)$
windowrule = center true, match:class ^(vimb-keys)$

# NHQ Secret Clipboard — local-only secure scratch file, never committed to any repo
bind = $mainMod CTRL SHIFT, S, exec, xed /home/yash/.nhq-clipboard

# ── Super+S small floating scratchpad (xed GUI notepad) ──────────────────────
# HyDE's keybindings.conf binds $mainMod,S -> togglespecialworkspace, which pops an
# input-capturing overlay that dims the whole screen. Instead, bind Super+S to a
# toggle script that hides/shows ONE small floating xed window (editing
# ~/scratchpad.md) by stashing it to/from special:scratchpadhidden — so the rest of
# the screen stays fully clickable, with no screen-wide blur/dim/input-capture.
unbind = $mainMod, S            # Original: toggle unnamed special workspace
bind = $mainMod, S, exec, /home/yash/.config/hypr/scratchpad-toggle.sh

# The scratchpad is an independent minimal Sublime instance (class `sublime_text`, shared
# with the main Sublime); it's matched by TITLE (always contains "scratchpad.md"), which
# keeps these rules scoped to just the scratchpad and not the main Sublime windows.
# Small floating editor, top-right corner. (Hyprland 0.55's windowrule engine has
# no noblur/nodim/noshadow fields, and HyDE forces every window `opaque` with no
# dimaround, so per-window blur/dim are moot; the screen-wide dim/input-capture is
# avoided by using a normal floating window instead of togglespecialworkspace.)
# Corner placement is done in scratchpad-toggle.sh (GTK re-centres floating windows).
windowrule = float true, match:title ^(.*[Ss]cratchpad\.md.*)$
windowrule = size 600 240, match:title ^(.*[Ss]cratchpad\.md.*)$
# Fully transparent when not hovered/focused, fully opaque when hovered (follow_mouse=1
# makes hover == focus). `override` beats HyDE's global opaque rule. Active 1.0, inactive 0.0.
windowrule = opacity 1.0 override 0.0 override, match:title ^(.*[Ss]cratchpad\.md.*)$

# ── F-row keybinds ─────────────────────────────────────────────────────────
# 2026-07-31 (Envy). This laptop has media keys as PRIMARY on the F-row, so the
# bare press does mute/brightness/volume and `Fn` gives the REAL F1..F12. Verified
# with `libinput debug-events --show-keycodes`: Fn+F1/F2/F3 arrive cleanly as
# KEY_F1 (59) / KEY_F2 (60) / KEY_F3 (61), and `Fn` itself emits nothing — it is
# handled in firmware and never reaches the OS.
#
# So "Fn+F1 does nothing" was never a broken key: F1-F9 simply had no binding.
# HyDE already claims the bare F10/F11/F12 (mute, vol-, vol+), leaving F1-F9 free.
bindd = , F1, [Launcher|Apps] terminal, exec, $TERMINAL
