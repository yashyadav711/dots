# Noise-suppressed virtual mic source.
# Wired by Envy 2026-07-04 — the HP Envy 13's internal mic peaks around -12.5dB even
# with ALSA Capture + Internal Mic Boost both already maxed (30dB each, no more headroom
# there). Measured via `pw-record` + `ffmpeg volumedetect`: speaking directly into the
# mic produced the SAME dB profile as silence, which is why hyprvoice kept hallucinating
# ambient captions ("[wind blowing]", "(waves crashing)") instead of transcribing speech.
#
# This is RNNoise denoise only -> new source "rnnoise_source". Gain boost is applied
# separately via `wpctl set-volume rnnoise_source <value> -l <limit>` (see LOG.md),
# NOT a second filter-graph node — an earlier attempt at a two-node graph (rnnoise ->
# builtin gain) crashed pipewire outright: the guessed LADSPA port names ("rnnoise:Out")
# don't match librnnoise_ladspa's real ports, and the builtin "linear" filter doesn't
# accept a bare "Gain" control the way it was written. Single-node graphs don't need
# explicit port wiring, which is why this version is safe.
#
# Requires: sudo pacman -S noise-suppression-for-voice (ships librnnoise_ladspa.so)
# Apply: systemctl --user restart pipewire pipewire-pulse wireplumber
# Verify: wpctl status should list "Noise Canceling source" under Audio > Sources.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Noise Canceling source"
            media.name       = "Noise Canceling source"
            filter.graph = {
                nodes = [
                    {
                        type    = ladspa
                        name    = rnnoise
                        plugin  = /usr/lib/ladspa/librnnoise_ladspa.so
                        label   = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"          50.0
                            "VAD Grace Period (ms)"      200
                            "Retroactive VAD Grace (ms)" 0
                        }
                    }
                ]
            }
            capture.props = {
                node.name    = "capture.rnnoise_source"
                node.passive = true
                audio.rate   = 48000
            }
            playback.props = {
                node.name   = "rnnoise_source"
                media.class = "Audio/Source"
                audio.rate  = 48000
            }
        }
    }
]
