include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {tab.active_wd.rsplit('/', 1)[-1] or '/'}{' [{}]'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Keybindings
# Rename the current tab (overrides the auto folder-name title)
map ctrl+shift+r            set_tab_title
# Disable accidental close binds (Pilot uses Super+Q to close windows instead)
map ctrl+shift+w            no_op
map ctrl+shift+q            no_op

# Ctrl+Up -> scroll back to your previous message in an agent chat.
# omp wraps every user message in OSC 133 prompt marks, and kitty's
# scroll_to_prompt jumps between them, so the real scrollback moves.
# Inside tmux the tmux binding is the one that fires, not this. Keys hit kitty FIRST,
# but tmux runs on the alternate screen where there are no prompt marks to jump to, so
# scroll_to_prompt is a no-op and kitty passes the chord through. Measured 2026-08-12:
# Ctrl+Up inside tmux flips `pane_in_mode` 0 -> 1, i.e. tmux got it. Both layers can
# keep their binding; whichever one is in front does the right thing.
map ctrl+up                 scroll_to_prompt -1
map ctrl+shift+up           scroll_to_prompt 1

# Ctrl+Enter / Shift+Enter -> hand-encode the CSI-u bytes.
#
# omp uses these two chords (queue a follow-up / insert a newline) and they broke the
# day omp moved inside tmux. Measured 2026-08-12 with a raw-key probe:
#   kitty asked for the kitty keyboard protocol  -> Ctrl+Enter = \e[13;5u   (distinct)
#   kitty asked for xterm modifyOtherKeys        -> Ctrl+Enter = \r         (flattened)
# kitty only encodes a modified Enter in its OWN protocol; under modifyOtherKeys it
# treats Enter as a legacy key and drops the modifier. tmux 3.7b speaks only
# modifyOtherKeys, so the chord dies at the kitty->tmux hop no matter how tmux is
# configured. Emitting the bytes ourselves sidesteps the whole negotiation.
#
# Safe outside tmux too: \e[13;5u is byte-identical to what kitty sends on its own
# when an app has the kitty protocol on, so bare-kitty omp sees no change.
map ctrl+enter              send_text all \x1b[13;5u
map shift+enter             send_text all \x1b[13;2u

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
input_delay 0
repaint_delay 2
sync_to_monitor no


# wayland_enable_ime no
copy_on_select yes

# Font settings
font_size 12
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Devanagari (Hindi) — JetBrains Mono has no Devanagari glyphs, so map the
# Devanagari + Vedic + Devanagari-Extended ranges to Noto Sans Devanagari.
symbol_map U+0900-U+097F,U+1CD0-U+1CFF,U+A8E0-U+A8FF Noto Sans Devanagari

# Cursor settings
cursor_shape     block
cursor_blink_interval 0.2

touch_scroll_multiplier 5.0

background_opacity 0.90

# Bell / notifications
enable_audio_bell yes
bell_path /home/yash/.config/dunst/service-login.wav
window_alert_on_bell yes
bell_on_tab yes
